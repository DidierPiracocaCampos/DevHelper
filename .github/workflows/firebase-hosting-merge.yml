# Auto-generated from portafolio (firebase-tools) adapted for DevHelper
# D1=B (solo merge), D4 cache pnpm, D5 firebase-tools directo
name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      - name: Setup Node 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Inject Firebase Secrets
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}
          FIREBASE_PROJECT_NUMBER: ${{ secrets.FIREBASE_PROJECT_NUMBER }}
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
        run: |
          sed -i "s|FIREBASE_API_KEY|$FIREBASE_API_KEY|g" src/environment/environment.ts
          sed -i "s|FIREBASE_AUTH_DOMAIN|$FIREBASE_AUTH_DOMAIN|g" src/environment/environment.ts
          sed -i "s|FIREBASE_DATABASE_URL|$FIREBASE_DATABASE_URL|g" src/environment/environment.ts
          sed -i "s|FIREBASE_PROJECT_ID|$FIREBASE_PROJECT_ID|g" src/environment/environment.ts
          sed -i "s|FIREBASE_STORAGE_BUCKET|$FIREBASE_STORAGE_BUCKET|g" src/environment/environment.ts
          sed -i "s|FIREBASE_MESSAGING_SENDER_ID|$FIREBASE_MESSAGING_SENDER_ID|g" src/environment/environment.ts
          sed -i "s|FIREBASE_APP_ID|$FIREBASE_APP_ID|g" src/environment/environment.ts
          sed -i "s|FIREBASE_MEASUREMENT_ID|$FIREBASE_MEASUREMENT_ID|g" src/environment/environment.ts
          sed -i "s|FIREBASE_PROJECT_NUMBER|$FIREBASE_PROJECT_NUMBER|g" src/environment/environment.ts
          sed -i "s|NASA_API_KEY|$NASA_API_KEY|g" src/environment/environment.ts

      - name: Install & Build
        run: pnpm install && pnpm run build

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting
        run: |
          # Soporta ambos: SERVICE_ACCOUNT_JSON (preferido) y FIREBASE_TOKEN (firebase login:ci)
          if printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEVHELPER_A61EF }}' | grep -q "service_account"; then
            printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEVHELPER_A61EF }}' > $HOME/firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=$HOME/firebase-sa.json
            echo "Deploying with Service Account..."
            firebase deploy --only hosting --project devhelper-a61ef --non-interactive
          else
            echo "Deploying with FIREBASE_TOKEN..."
            firebase deploy --only hosting --project devhelper-a61ef --non-interactive --token "${{ secrets.FIREBASE_TOKEN }}"
          fi

