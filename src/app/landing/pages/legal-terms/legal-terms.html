<landing-site-header [isLogged]="isLogged()" />
<main>
  @if (showAccept()) {
    <div class="terms__accept">
      <div class="terms__accept-row">
        <p>Hay una nueva versión de estos Términos.</p>
        <button type="button" class="btn btn-primary btn-sm" (click)="accept()">Aceptar</button>
      </div>
    </div>
  }

  <article class="terms">
    @if (loadFailed()) {
      <p class="terms__error" role="alert">
        No se pudo cargar el documento. Recarga la página o inténtalo más tarde.
      </p>
    } @else {
      <div [innerHTML]="content() | markdown"></div>
    }
    <a href="/legal/terms-es.md" target="_blank" rel="noopener" class="link terms__raw">
      Ver documento en Markdown sin formato
    </a>
  </article>
</main>
<landing-site-footer />
