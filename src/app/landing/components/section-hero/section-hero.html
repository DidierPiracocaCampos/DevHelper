<section class="frost-effect section-hero">
  <div
    class="max-w-7xl mx-auto px-4 py-16 sm:py-24 grid grid-cols-1 lg:grid-cols-2 gap-12 items-center"
  >
    <div class="text-center lg:text-left">
      <span class="badge badge-outline gap-1 hero-reveal hero-reveal--1">
        <span class="icon icon-sm" aria-hidden="true">lock</span>
        WORKSPACE TÉCNICO · CIFRADO EN CLIENTE
      </span>

      <h1 class="font-bold text-3xl sm:text-5xl tracking-tight mt-4 hero-reveal hero-reveal--2">
        Tu memoria técnica, organizada y protegida.
      </h1>

      <p class="mt-4 text-base sm:text-lg opacity-80 hero-reveal hero-reveal--3">
        Centraliza proyectos, tareas, credenciales, archivos y eventos; consulta tu memoria técnica
        con IA local, con los datos cifrados antes de sincronizar.
      </p>

      <div
        class="mt-8 flex flex-wrap items-center justify-center lg:justify-start gap-3 hero-reveal hero-reveal--4"
      >
        <a routerLink="/login/register" class="btn btn-primary btn-lg section-hero__cta-primary">
          Crear mi workspace
        </a>
        <a
          routerLink="/"
          fragment="how-it-works"
          class="btn btn-ghost btn-lg section-hero__cta-secondary"
        >
          Ver cómo funciona
        </a>
      </div>
    </div>

    <div class="block hero-reveal hero-reveal--5">
      <div class="section-hero__visual-float">
        <div class="mockup-browser border border-base-300 bg-base-200 section-hero__visual">
          <div class="mockup-browser-toolbar">
            <div class="input">devhelper.app</div>
          </div>
          <img
            ngSrc="/img/landing/hero-home.webp"
            alt="DevHelper dashboard en uso real"
            width="1280"
            height="800"
            priority
            class="w-full h-auto"
          />
        </div>
      </div>
    </div>
  </div>
</section>
