<section class="landing-intro">
  <div class="intro mx-auto max-w-[90rem] px-4 sm:px-8 lg:px-16">
    <h1 class="intro__title">
      <span class="intro__line">Registra lo que resuelves.</span>
      &ngsp;
      <span class="intro__line">Encuéntralo cuando vuelva.</span>
    </h1>
    <p class="intro__lede">
      DevHelper es una app para registrar tus avances: proyectos y tareas con su solución, sus
      archivos, sus contraseñas y tus fechas, en un solo lugar.
    </p>
    <div class="intro__actions">
      <a routerLink="/login/register" class="btn btn-primary btn-lg">Crear cuenta</a>
      <a routerLink="/" fragment="features" class="btn btn-ghost btn-lg">Ver funciones</a>
    </div>
  </div>

  <div class="mx-auto max-w-[90rem] px-4 sm:px-8 lg:px-16">
    <figure class="product-shot">
      <div class="product-window">
        <div class="product-window__bar">
          <span class="icon" aria-hidden="true">code</span>
          <span>DevHelper</span>
        </div>
        <picture>
          <source
            media="(max-width: 47.99rem)"
            srcset="/img/landing/producto-movil.webp"
            width="780"
            height="1688"
          />
          <img
            src="/img/landing/producto-escritorio.webp"
            width="2880"
            height="1840"
            fetchpriority="high"
            decoding="async"
            alt="Pantalla principal de DevHelper con proyectos, tareas, calendario, archivos y contraseñas, con datos de ejemplo."
          />
        </picture>
      </div>
      <figcaption class="product-shot__caption">
        Pantalla real de DevHelper con datos de ejemplo.
      </figcaption>
    </figure>
  </div>
</section>
