<section [id]="id()">
  <div class="max-w-7xl mx-auto px-4 py-16">
    <h2 class="text-2xl sm:text-3xl font-semibold mb-3 text-center">
      Empieza en minutos. Conserva el contexto durante años.
    </h2>
    <p class="text-center opacity-70 mb-12 max-w-2xl mx-auto">
      Configura tu vault, guarda contexto y vuelve a encontrarlo sin cambiar de herramienta.
    </p>
    <div class="grid lg:grid-cols-3 gap-8 relative">
      <div
        class="hidden lg:block absolute top-12 left-0 right-0 h-px bg-base-300"
        aria-hidden="true"
      ></div>
      @for (step of steps; track step.number) {
        <div class="text-center">
          <div
            class="inline-flex items-center justify-center w-24 h-24 rounded-full bg-base-200 border border-base-300 mb-4 relative"
          >
            <span class="icon icon-lg text-primary" aria-hidden="true">{{ step.icon }}</span>
            <span class="absolute -top-2 -right-2 badge badge-primary">{{ step.number }}</span>
          </div>
          <h3 class="text-lg font-semibold mb-2">{{ step.title }}</h3>
          <p class="opacity-80 mb-3">{{ step.description }}</p>
          <a
            [routerLink]="step.link"
            [fragment]="step.fragment"
            class="link link-hover text-sm"
          >
            {{ step.linkLabel }}
          </a>
        </div>
      }
    </div>
  </div>
</section>
