<section [id]="id()" class="how">
  <div class="mx-auto max-w-[90rem] px-4 sm:px-8 lg:px-16">
    <h2 class="how__title">Tres pasos para no volver a buscarlo.</h2>
    <ol class="checklist">
      @for (step of steps; track step.number) {
        <li class="checklist__row">
          <span class="icon" aria-hidden="true">radio_button_unchecked</span>
          <h3 class="checklist__title">{{ step.title }}</h3>
          <p class="checklist__text">{{ step.description }}</p>
          <a [routerLink]="step.link" [fragment]="step.fragment" class="checklist__link link">
            {{ step.linkLabel }}
          </a>
        </li>
      }
    </ol>
  </div>
</section>
