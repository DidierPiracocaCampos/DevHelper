<section [id]="id()" class="bg-base-200">
  <div class="max-w-7xl mx-auto px-4 py-16 text-center">
    <h2 class="text-2xl sm:text-3xl font-semibold mb-3">
      Stack técnico transparente
    </h2>
    <p class="opacity-80 mb-8 max-w-2xl mx-auto">
      Todo el stack es open source y auditable. Sin vendor lock-in, sin SDKs
      propietarios, sin servicios opacos.
    </p>
    <div class="flex flex-wrap items-center justify-center gap-2 max-w-3xl mx-auto">
      @for (item of items; track item) {
        <span class="badge badge-lg badge-outline">{{ item }}</span>
      }
    </div>
  </div>
</section>
