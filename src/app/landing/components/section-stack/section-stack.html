<section [id]="id()" class="tech-stack">
  <div class="stack__inner mx-auto max-w-[90rem] px-4 sm:px-8 lg:px-16">
    <div>
      <h2 class="stack__title">Con qué está hecho</h2>
      <p class="stack__text">
        La interfaz usa software libre. Los datos y la autenticación viven en Firebase, un servicio
        de Google. El repositorio es público.
      </p>
      <a
        [href]="github"
        target="_blank"
        rel="noopener noreferrer"
        class="link underline-offset-4 mt-4 inline-block"
      >
        Ver el repositorio en GitHub
      </a>
    </div>
    <ul class="stack__list">
      @for (entry of entries; track entry.name) {
        <li class="stack__item">
          <span
            class="stack__logo"
            aria-hidden="true"
            [style.mask-image]="'url(' + entry.logo + ')'"
          ></span>
          <span class="stack__name">{{ entry.name }}</span>
          <span class="stack__role">{{ entry.role }}</span>
        </li>
      }
    </ul>
  </div>
</section>
