<section [id]="id()">
  <div class="max-w-7xl mx-auto px-4 py-12">
    <h2 class="text-2xl sm:text-3xl font-semibold mb-8 text-center">
      Todo lo que necesitas en un solo lugar
    </h2>
    <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
      @for (feature of features; track feature.title) {
        <div class="card card-xl bg-base-200">
          <div class="card-body">
            <span class="icon icon-lg text-primary">{{ feature.icon }}</span>
            <h3 class="card-title text-lg">{{ feature.title }}</h3>
            <p class="opacity-80">{{ feature.description }}</p>
          </div>
        </div>
      }
    </div>
  </div>
</section>
