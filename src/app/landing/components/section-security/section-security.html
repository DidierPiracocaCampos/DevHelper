<section [id]="id()" class="bg-base-200">
  <div class="max-w-7xl mx-auto px-4 py-12 grid grid-cols-1 lg:grid-cols-2 gap-12 items-center">
    <div>
      <h2 class="text-2xl sm:text-3xl font-semibold mb-6">Seguridad y privacidad</h2>
      <ul class="space-y-4">
        @for (item of items; track item.text) {
          <li class="flex items-start gap-3">
            <span class="icon text-primary shrink-0 mt-0.5" aria-hidden="true">shield</span>
            <span>{{ item.text }}</span>
          </li>
        }
      </ul>
      <div class="mt-8">
        <a routerLink="/legal/terms" target="_blank" rel="noopener" class="link link-hover">
          Lee los detalles en Términos y Condiciones
        </a>
      </div>
    </div>
    <div class="block">
      <img
        ngSrc="/img/landing/vault-home.webp"
        alt="Vista del workspace protegido de DevHelper"
        width="2560"
        height="1600"
        loading="lazy"
        class="rounded-xl border border-base-300 shadow-lg w-full h-auto section-security__visual"
      />
    </div>
  </div>
</section>
