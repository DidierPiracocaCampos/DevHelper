<section [id]="id()" class="bg-base-200">
  <div class="max-w-5xl mx-auto px-4 py-12">
    <h2 class="text-2xl sm:text-3xl font-semibold mb-6">
      Seguridad y privacidad
    </h2>
    <ul class="space-y-3">
      @for (item of items; track item.text) {
        <li class="flex items-start gap-3">
          <span class="icon text-primary shrink-0 mt-0.5">shield</span>
          <span>{{ item.text }}</span>
        </li>
      }
    </ul>
    <div class="mt-8">
      <a
        routerLink="/legal/terms"
        target="_blank"
        rel="noopener"
        class="link link-hover"
      >
        Lee los detalles en Términos y Condiciones
      </a>
    </div>
  </div>
</section>
