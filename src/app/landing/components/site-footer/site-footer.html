<footer class="border-t border-base-300 bg-base-200">
  <div
    class="max-w-7xl mx-auto px-4 py-8 grid grid-cols-1 md:grid-cols-4 gap-8 text-sm"
  >
    <div class="landing-site-footer__col">
      <h4 class="font-semibold mb-2">Producto</h4>
      <ul class="space-y-1">
        <li>
          <a class="link link-hover" routerLink="/" fragment="features">
            Características
          </a>
        </li>
        <li>
          <a class="link link-hover" routerLink="/" fragment="security">
            Seguridad
          </a>
        </li>
      </ul>
    </div>

    <div class="landing-site-footer__col">
      <h4 class="font-semibold mb-2">Legal</h4>
      <ul class="space-y-1">
        <li>
          <a class="link link-hover" routerLink="/legal/terms">
            Términos y Condiciones
          </a>
        </li>
        <li>
          <a class="link link-hover" routerLink="/about">Acerca de</a>
        </li>
      </ul>
    </div>

    <div class="landing-site-footer__col">
      <h4 class="font-semibold mb-2">Comunidad</h4>
      <ul class="space-y-2">
        <li>
          <a
            [href]="social.github"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="DevHelper en GitHub"
            class="link link-hover inline-flex items-center gap-2"
          >
            <img
              src="/icons/github.svg"
              width="18"
              height="18"
              alt=""
              aria-hidden="true"
              class="opacity-80"
            />
            GitHub
          </a>
        </li>
        <li>
          <a
            [href]="social.instagram"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="DevHelper en Instagram"
            class="link link-hover inline-flex items-center gap-2"
          >
            <img
              src="/icons/instagram.svg"
              width="18"
              height="18"
              alt=""
              aria-hidden="true"
              class="opacity-80"
            />
            Instagram
          </a>
        </li>
      </ul>
    </div>

    <div class="landing-site-footer__col">
      <p class="font-semibold inline-flex items-center gap-1.5">
        <span class="icon text-xl" aria-hidden="true">code</span>
        DevHelper &copy; 2026
      </p>
      <p class="text-xs opacity-70 mt-1">T&amp;C versión {{ termsVersion }}</p>
    </div>
  </div>
</footer>
