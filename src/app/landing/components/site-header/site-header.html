<header
  class="sticky top-0 z-50 bg-base-100/80 backdrop-blur border-b border-base-300"
>
  <div class="max-w-7xl mx-auto flex items-center justify-between gap-4 px-4 py-3">
    <a
      routerLink="/"
      class="font-bold text-lg tracking-tight hover:opacity-80"
      aria-label="DevHelper - Inicio"
    >
      DevHelper
    </a>

    <nav class="hidden md:flex items-center gap-2">
      <a routerLink="/" fragment="features" class="link link-hover text-sm px-1">
        Características
      </a>
      <a routerLink="/" fragment="how-it-works" class="link link-hover text-sm px-1">
        Cómo funciona
      </a>
      <a routerLink="/" fragment="security" class="link link-hover text-sm px-1">
        Seguridad
      </a>
      @if (!isLogged()) {
        <a routerLink="/login" class="btn btn-ghost btn-sm sm:btn-md">
          Iniciar sesión
        </a>
        <a
          routerLink="/login/register"
          class="btn btn-primary btn-sm sm:btn-md"
        >
          Crear cuenta
        </a>
      } @else {
        <a routerLink="/home" class="btn btn-ghost btn-sm sm:btn-md">
          Ir al dashboard
        </a>
        <button
          type="button"
          class="btn btn-error btn-outline btn-sm sm:btn-md"
          (click)="logout()"
        >
          Cerrar sesión
        </button>
      }
    </nav>

    <div class="dropdown dropdown-end md:hidden">
      <div
        tabindex="0"
        role="button"
        aria-label="Abrir menú"
        class="btn btn-ghost btn-square"
      >
        <span class="icon" aria-hidden="true">menu</span>
      </div>
      <ul
        tabindex="0"
        class="menu dropdown-content z-1 bg-base-200 border border-base-300 rounded-box shadow-lg w-60 p-2 mt-3 gap-1"
      >
        <li>
          <a routerLink="/" fragment="features">Características</a>
        </li>
        <li>
          <a routerLink="/" fragment="how-it-works">Cómo funciona</a>
        </li>
        <li>
          <a routerLink="/" fragment="security">Seguridad</a>
        </li>
        <li class="border-t border-base-300 mt-1 pt-1"></li>
        @if (!isLogged()) {
          <li>
            <a routerLink="/login">Iniciar sesión</a>
          </li>
          <li>
            <a routerLink="/login/register">Crear cuenta</a>
          </li>
        } @else {
          <li>
            <a routerLink="/home">Ir al dashboard</a>
          </li>
          <li>
            <button type="button" class="text-error" (click)="logout()">
              Cerrar sesión
            </button>
          </li>
        }
      </ul>
    </div>
  </div>
</header>
