<section id="obsidian" class="obsidian-band">
  <div class="band mx-auto max-w-[90rem] px-4 sm:px-8 lg:px-16" landingReveal>
    <div class="band__copy">
      <h2 class="band__title">También en Obsidian.</h2>
      <p class="band__text">
        Si tus notas ya viven en un vault, el plugin DevHelper Dashboard registra tus proyectos y
        tareas ahí mismo, en Markdown. Con un theme a juego.
      </p>
    </div>
    <div class="band__actions">
      <a routerLink="/obsidian" class="btn btn-primary btn-lg">Ver el plugin y el theme</a>
      <a [href]="storeUrl" target="_blank" rel="noopener noreferrer" class="btn btn-ghost btn-lg">
        Instalar desde la tienda
        <span class="icon icon-sm" aria-hidden="true">open_in_new</span>
      </a>
    </div>
  </div>
</section>
